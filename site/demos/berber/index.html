<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Salon 34</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=7" />
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="who">
        <div class="mark">💈</div>
        <div>
          <strong>Salon 34</strong>
          <span><i></i> Ahmet · çevrimiçi</span>
        </div>
      </div>
      <div class="top-actions">
        <a href="admin.html">Randevular</a>
        <button id="resetBtn" type="button">Sıfırla</button>
      </div>
    </header>

    <div class="offers">
      <button type="button" data-msg="Saç kesimi fiyatı nedir?">
        <b>Saç</b>
        <small>250 TL</small>
      </button>
      <button type="button" data-msg="Sakal tıraşı fiyatı nedir?">
        <b>Sakal</b>
        <small>150 TL</small>
      </button>
      <button type="button" data-msg="Komple paket fiyatı nedir?">
        <b>Komple</b>
        <small>350 TL</small>
      </button>
    </div>

    <div id="chat" class="chat"></div>

    <footer class="dock">
      <div class="chips">
        <button type="button" data-msg="Fiyatlar nedir?">Fiyatlar</button>
        <button type="button" data-msg="Yarın uygun saat var mı?">Uygun saat</button>
        <button type="button" data-msg="1">1. saat</button>
        <button type="button" data-msg="onaylıyorum">Onayla</button>
      </div>
      <form id="form">
        <input id="input" type="text" placeholder="Mesaj yaz…" autocomplete="off" />
        <button type="submit">Gönder</button>
      </form>
    </footer>
  </div>
  <script src="chat.js?v=5"></script>
</body>
</html>
