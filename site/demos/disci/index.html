<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Klinik Asistanı</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="chat.css?v=7" />
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="who">
        <div class="mark">🦷</div>
        <div>
          <strong>Diş Kliniği</strong>
          <span>Randevu asistanı · 7/24</span>
        </div>
      </div>
      <button id="resetBtn" type="button">Sıfırla</button>
    </header>

    <div class="treats">
      <button type="button" data-msg="Muayene fiyatı nedir?"><b>Muayene</b><small>750 TL</small></button>
      <button type="button" data-msg="Dolgu fiyatı nedir?"><b>Dolgu</b><small>2.500 TL</small></button>
      <button type="button" data-msg="Kanal tedavisi fiyatı nedir?"><b>Kanal</b><small>4.500 TL</small></button>
      <button type="button" data-msg="Beyazlatma fiyatı nedir?"><b>Beyazlatma</b><small>6.000 TL</small></button>
    </div>

    <div id="chat" class="chat"></div>

    <footer class="dock">
      <div class="chips">
        <button type="button" data-msg="Fiyat listesi nedir?">Fiyat listesi</button>
        <button type="button" data-msg="2026-02-04 - 2026-02-06 randevu">Tarih ara</button>
        <button type="button" data-msg="1">1. slot</button>
        <button type="button" data-msg="onaylıyorum">Onayla</button>
      </div>
      <form id="form">
        <input id="input" type="text" placeholder="Tedavi veya tarih yazın…" autocomplete="off" />
        <button type="submit">Gönder</button>
      </form>
    </footer>
  </div>
  <script src="chat.js?v=5"></script>
</body>
</html>
