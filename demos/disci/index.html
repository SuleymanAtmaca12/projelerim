<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dişçi Asistan</title>
  <link rel="stylesheet" href="chat.css?v=2" />
</head>
<body>
  <div class="app">
    <aside class="rail">
      <div class="brand">
        <div class="logo">🦷</div>
        <div>
          <strong>Klinik Asistanı</strong>
          <span>Fiyat · slot · kayıt</span>
        </div>
      </div>

      <h2>Tedaviler</h2>
      <div class="cards">
        <button class="svc" data-msg="Muayene fiyatı nedir?">
          <b>Muayene</b>
          <span>750 TL</span>
        </button>
        <button class="svc" data-msg="Dolgu fiyatı nedir?">
          <b>Dolgu</b>
          <span>2.500 TL</span>
        </button>
        <button class="svc" data-msg="Kanal tedavisi fiyatı nedir?">
          <b>Kanal</b>
          <span>4.500 TL</span>
        </button>
        <button class="svc" data-msg="Beyazlatma fiyatı nedir?">
          <b>Beyazlatma</b>
          <span>6.000 TL</span>
        </button>
      </div>

      <h2>Hekimler</h2>
      <div class="people">
        <div class="person"><i>A</i><div><b>Dr. Atakan</b><span>04 Şub 10:00</span></div></div>
        <div class="person"><i>S</i><div><b>Dr. Süleyman</b><span>04 Şub 11:00</span></div></div>
      </div>
    </aside>

    <section class="stage">
      <header>
        <div>
          <p class="kicker">Tool kullanan klinik asistanı</p>
          <h1>Dişçi Randevu Asistanı</h1>
        </div>
        <button id="resetBtn" type="button">Sıfırla</button>
      </header>

      <div id="chat" class="chat"></div>

      <div class="chips" id="chips">
        <button type="button" data-msg="Fiyat listesi nedir?">Fiyat listesi</button>
        <button type="button" data-msg="2026-02-04 - 2026-02-06 randevu">Tarih aralığı</button>
        <button type="button" data-msg="1">1. slot</button>
        <button type="button" data-msg="onaylıyorum">Onayla</button>
      </div>

      <form id="form" class="composer">
        <input id="input" type="text" placeholder="Örn. dolgu fiyatı veya 2026-02-04 - 2026-02-06" autocomplete="off" />
        <button type="submit">Gönder</button>
      </form>
      <p class="hint">Akış: fiyat sor → tarih aralığı ver → numarayı seç → ad/telefon yaz → onaylıyorum de.</p>
    </section>
  </div>
  <script src="chat.js"></script>
</body>
</html>
